name: Native stream helper

on:
  push:
    paths:
      - 'native/stream-helper/**'
      - 'addons/redot-tuber/bin/**'
      - '.gitattributes'
      - '.github/workflows/stream-helper.yml'
  pull_request:
    paths:
      - 'native/stream-helper/**'
      - 'addons/redot-tuber/bin/**'
      - '.gitattributes'
      - '.github/workflows/stream-helper.yml'

permissions:
  contents: read

jobs:
  native-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux
            suffix: ''
          - runner: windows-latest
            platform: windows
            suffix: '.exe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CGO_ENABLED: '0'
      GOARCH: amd64
      GOAMD64: v1
      GOTOOLCHAIN: local
    defaults:
      run:
        shell: bash
        working-directory: native/stream-helper
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: native/stream-helper/go.sum
      - name: Verify dependencies and run real gRPC/process tests
        run: |
          set -euo pipefail
          go version
          go mod download
          go mod verify
          go test -count=1 -timeout 90s -v ./...
      - name: Check concurrent lifecycle safety
        if: matrix.platform == 'linux'
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 -timeout 90s ./...
      - name: Build the native platform helper
        run: |
          set -euo pipefail
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$RUNNER_TEMP/redot-tuber-stream-helper${{ matrix.suffix }}" .
          sha256sum "$RUNNER_TEMP/redot-tuber-stream-helper${{ matrix.suffix }}"
          cmp "$RUNNER_TEMP/redot-tuber-stream-helper${{ matrix.suffix }}" "../../addons/redot-tuber/bin/${{ matrix.platform }}/x86_64/redot-tuber-stream-helper${{ matrix.suffix }}"
